[package]
name = "urban-tree-observatory"
version = "0.1.0"
edition = "2024"
# MSRV-aware dependency resolution (resolver 3): keeps deps compatible with the local toolchain.
rust-version = "1.90"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "HtmlElement", "HtmlDivElement", "HtmlAnchorElement", "HtmlInputElement", "Blob", "BlobPropertyBag", "Url", "KeyboardEvent", "Storage", "console"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[features]
# Reports and Alerts pages (and the navbar bell). Meant for administrators and partner
# institutions once there is a login; off for the public demo. Build with
# `--features restricted-pages` (or `trunk serve --features restricted-pages`) to see them.
restricted-pages = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
